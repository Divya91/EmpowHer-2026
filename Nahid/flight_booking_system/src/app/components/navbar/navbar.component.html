<header class="navbar">
  <div class="navbar-inner">

    <a routerLink="/" class="brand" (click)="closeMenu()">
      <img src="images/logo.jpg" alt="Flight Booking" class="brand-logo" />
      <span class="brand-name">Flight Booking</span>
    </a>

    <nav class="nav-links" [class.open]="isMenuOpen">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()">
        Home
      </a>
      <a
        routerLink="/flights"
        routerLinkActive="active"
        (click)="closeMenu()">
        Flights
      </a>
      @if (authService.isLoggedIn()) {
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          (click)="closeMenu()">
          Dashboard
        </a>
      }
    </nav>

    <div class="navbar-actions">

      @if (authService.isLoggedIn()) {

        <div class="profile-menu">
          <button type="button" class="profile-trigger" (click)="toggleProfile()">
            <span class="avatar">{{ initials(authService.currentUser()?.name) }}</span>
            <span class="profile-label">
              <span class="profile-name">{{ authService.currentUser()?.name }}</span>
              <span class="profile-role">{{ authService.currentUser()?.role }}</span>
            </span>
          </button>

          @if (isProfileOpen) {
            <div class="profile-dropdown">
              <div class="profile-dropdown-header">
                <span class="profile-dropdown-name">{{ authService.currentUser()?.name }}</span>
                <span class="profile-dropdown-email">{{ authService.currentUser()?.email }}</span>
              </div>
              <a routerLink="/dashboard" class="profile-dropdown-item" (click)="isProfileOpen = false">
                Dashboard
              </a>
              <button type="button" class="profile-dropdown-item logout" (click)="logout()">
                Logout
              </button>
            </div>
          }
        </div>

      } @else {

        <a routerLink="/auth" class="btn-ghost">Login</a>
        <a routerLink="/auth" [queryParams]="{ mode: 'signup' }" class="btn-solid">Sign Up</a>

      }

      <button type="button" class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </div>
</header>
