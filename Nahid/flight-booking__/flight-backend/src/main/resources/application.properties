spring.application.name=skysafar-backend
server.port=8080

# FIX: Spring Boot does NOT read .env files on its own — without this line, the
# values in flight-backend/.env (SUPABASE_JDBC_URL, SUPABASE_DB_USER, etc.)
# were never picked up, so the ${...} placeholders in application-supabase.properties
# fell back to their dummy defaults and the app could never reach Supabase.
# "optional:" means it won't fail to start if .env is missing (e.g. in prod where
# real env vars are set instead); [.properties] tells Spring to parse the
# extension-less file using KEY=VALUE (.properties) syntax.
spring.config.import=optional:file:.env[.properties]

# Default: H2 in-memory (dev). Use --spring.profiles.active=postgres for PostgreSQL
spring.datasource.url=jdbc:h2:mem:skysafar;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=SkySafarSuperSecretKeyForFlightBookingApplication2026SecretKey
jwt.expiration=86400000
