<div class="search-card">
  <p class="eyebrow">Flight Search</p>
  <h2>Where would you like to go?</h2>

  <div class="search-grid">
    <div class="form-group">
      <label>From</label>
      <input type="text" placeholder="DEL, BOM, BLR..." [(ngModel)]="search.from" />
    </div>
    <div class="form-group">
      <label>To</label>
      <input type="text" placeholder="Destination code" [(ngModel)]="search.to" />
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" [(ngModel)]="search.date" />
    </div>
    <div class="form-group">
      <label>Travellers</label>
      <input type="number" min="1" max="9" [(ngModel)]="search.passengers" />
    </div>
    <div class="form-group">
      <label>Stops</label>
      <select [(ngModel)]="search.stops">
        <option value="">Any</option>
        <option value="0">Direct only</option>
        <option value="1">1 stop</option>
        <option value="2">2+ stops</option>
      </select>
    </div>
  </div>

  <button class="search-btn" (click)="searchFlights()">Search Flights</button>
</div>
