<div class="passenger-page">

  <!-- Toast notification (replaces browser alert()) -->
  <div
    class="toast"
    *ngIf="toast"
    [ngClass]="toast.type">
    {{ toast.message }}
  </div>

  <div class="passenger-container">

    <div class="passenger-header">
      <span class="eyebrow">✈ Fly smarter with Flyora</span>
      <h2>Passenger Details</h2>
      <p class="subtitle">Please enter accurate details as per your government ID.</p>
    </div>

    <form #passengerForm="ngForm" (ngSubmit)="savePassenger()">

      <div class="form-row">

        <!-- First Name -->
        <div class="form-group">
          <label>First Name</label>
          <input
            type="text"
            name="firstName"
            [(ngModel)]="passenger.firstName"
            required
            minlength="2"
            maxlength="30"
            pattern="^[A-Za-z]+(?: [A-Za-z]+)*$"
            (keypress)="onlyLetters($event)"
            #firstName="ngModel"
            [class.invalid-input]="firstName.invalid && firstName.touched">

          <small
            class="error"
            *ngIf="firstName.invalid && firstName.touched">
            Enter a valid first name
          </small>
        </div>

        <!-- Last Name -->
        <div class="form-group">
          <label>Last Name</label>
          <input
            type="text"
            name="lastName"
            [(ngModel)]="passenger.lastName"
            required
            minlength="2"
            maxlength="30"
            pattern="^[A-Za-z]+(?: [A-Za-z]+)*$"
            (keypress)="onlyLetters($event)"
            #lastName="ngModel"
            [class.invalid-input]="lastName.invalid && lastName.touched">

          <small
            class="error"
            *ngIf="lastName.invalid && lastName.touched">
            Enter a valid last name
          </small>
        </div>

      </div>

      <div class="form-row">

        <!-- Age -->
        <div class="form-group">
          <label>Age</label>
          <input
            type="text"
            inputmode="numeric"
            name="age"
            [(ngModel)]="passenger.age"
            required
            maxlength="3"
            (keypress)="onlyNumbers($event)"
            (input)="limitAge($event)"
            #age="ngModel"
            [class.invalid-input]="passenger.age < 1 || passenger.age > 120"
            [class.valid-input]="passenger.age >= 1 && passenger.age <= 120">

          <small
            class="error"
            *ngIf="age.touched && (passenger.age < 1 || passenger.age > 120)">
            Age must be between 1 and 120
          </small>
        </div>

        <!-- Gender -->
        <div class="form-group">
          <label>Gender</label>
          <select
            name="gender"
            [(ngModel)]="passenger.gender"
            required
            #gender="ngModel"
            [class.invalid-input]="gender.invalid && gender.touched">

            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>

          <small
            class="error"
            *ngIf="gender.invalid && gender.touched">
            Please select gender
          </small>
        </div>

      </div>

      <div class="form-row">

        <!-- Email -->
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="passenger.email"
            required
            pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$"
            #email="ngModel"
            [class.invalid-input]="email.invalid && email.touched">

          <small
            class="error"
            *ngIf="email.invalid && email.touched">
            Enter a valid email
          </small>
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label>Phone Number</label>
          <input
            type="text"
            inputmode="numeric"
            name="phone"
            [(ngModel)]="passenger.phone"
            required
            minlength="10"
            maxlength="10"
            pattern="[0-9]{10}"
            (keypress)="onlyNumbers($event)"
            #phone="ngModel"
            [class.invalid-input]="phone.invalid && phone.touched">

          <small
            class="error"
            *ngIf="phone.invalid && phone.touched">
            Enter a valid 10-digit phone number
          </small>
        </div>

      </div>

      <button
        class="submit-btn"
        type="submit"
        [disabled]="passengerForm.invalid || passenger.age < 1 || passenger.age > 120">
        Continue to Payment →
      </button>

    </form>

  </div>
</div>
