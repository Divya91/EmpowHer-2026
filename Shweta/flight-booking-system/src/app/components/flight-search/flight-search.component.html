<div class="flight-search">
  <label for="fromAirport">
    Source
    <input
      type="text"
      id="fromAirport"
      name="fromAirport"
      placeholder="Source Airport"
      [(ngModel)]="searchCriteria.fromAirport"
    />
  </label>

  <label for="toAirport">
    Destination
    <input
      type="text"
      id="toAirport"
      name="toAirport"
      placeholder="Destination Airport"
      [(ngModel)]="searchCriteria.toAirport"
    />
  </label>

  <label for="departureDate">
    Departure Date
    <input
      type="date"
      id="departureDate"
      name="departureDate"
      [(ngModel)]="searchCriteria.departureDate"
    />
  </label>

  <label for="passengers">
    Passengers
    <input
      type="number"
      id="passengers"
      name="passengers"
      placeholder="Passengers"
      [(ngModel)]="searchCriteria.passengers"
    />
  </label>

  <button type="button" (click)="searchFlights()">
    Filter Flights
  </button>

  @if (loading) {
    <div class="loading-message">Loading data...</div>
  } @else {
    <app-flight-results
      [flightResults]="flightResults"
    ></app-flight-results>
  }
</div>
