<div class="auth-container">

  <div class="hero-section">

    <img
      src="images/flight.avif"
      alt="Flight Booking"
      class="hero-image"
    />

    <div class="hero-overlay">

      <div class="hero-content">

        <h1>
          Your Journey
          <br>
          Begins Here
        </h1>

        <p>
          Create your account to search flights, book tickets, manage your
          reservations, and enjoy a seamless travel experience.
        </p>

        
      </div>

    </div>

  </div>

  <div class="auth-card">

    <h1>Create Account</h1>

    <p class="subtitle">
      Join the Flight Booking System
    </p>

    <form>

      <div class="input-group">
        <label>Full Name</label>

        <input
          type="text"
          placeholder="Enter your full name"
        />
      </div>

      <div class="input-group">
        <label>Email Address</label>

        <input
          type="email"
          placeholder="Enter your email"
        />
      </div>

      <div class="input-group">
        <label>Password</label>

        <input
          type="password"
          placeholder="Create a password"
        />
      </div>

      <div class="input-group">
        <label>Confirm Password</label>

        <input
          type="password"
          placeholder="Confirm your password"
        />
      </div>

      <div class="input-group">

        <label>Register As</label>

        <select>

          <option selected disabled>
            Select Role
          </option>

          <option>
            User
          </option>

          <option>
            Admin
          </option>

        </select>

      </div>

      <button
        type="submit"
        class="btn-login">

        Create Account

      </button>

    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <p class="bottom-text">
      Already have an account?
      <a routerLink="/login">
        Login
      </a>
    </p>

  </div>

</div>
