<div class="auth-container">
  <div class="hero-section">
    <img
      src="images/flight.avif"
      alt="Flight Booking"
      class="hero-image"
    />
    <div class="hero-overlay">
      <div class="hero-content">
        <h1>
          Your Journey
          <br>
          Begins Here
        </h1>
        <p>
          Create your account to search flights, book tickets, manage your
          reservations, and enjoy a seamless travel experience.
        </p>
      </div>
    </div>
  </div>

  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">
      Join the Flight Booking System
    </p>

    <form (ngSubmit)="onRegister()">
      <div class="input-group">
        <label>First Name</label>
        <input type="text" name="firstName" [(ngModel)]="firstName" placeholder="Enter your first name" required />
      </div>

      <div class="input-group">
        <label>Last Name</label>
        <input type="text" name="lastName" [(ngModel)]="lastName" placeholder="Enter your last name" required />
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required />
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="password" placeholder="Create a password" required />
      </div>

      <button type="submit" class="btn-login">
        Create Account
      </button>
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <p class="bottom-text">
      Already have an account?
      <a routerLink="/login" [queryParams]="{role: 'USER'}">
        Login
      </a>
    </p>
  </div>
</div>
