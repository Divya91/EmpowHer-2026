<div class="auth-container">
  <div class="hero-section">
   <img
      src="images/flight.avif"
      alt="Flight Booking"
      class="hero-image"
    />
    <div class="hero-overlay">
      <div class="hero-content">

        <h1>
          Discover the World
          <br>
          With Confidence
        </h1>

        <p>
          Book flights, manage reservations, and explore destinations
          around the globe with a seamless travel experience.
        </p>        
      </div>
    </div>
  </div>
  <div class="auth-card">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Sign in to continue your journey.
    </p>

    <form (ngSubmit)="onLogin()">

      <div class="input-group">

        <label>Email Address</label>

        <input type="email" name="email" [(ngModel)]="email" placeholder="Enter your email"  required   />

      </div>

      <div class="input-group">

        <label>Password</label>

        <input type="password" name="password" [(ngModel)]="password" placeholder="Enter your password" required/>

      </div>


      <button type="submit" class="btn-login"> Login </button>

    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <p class="bottom-text" style="display: flex; flex-direction: column; gap: 5px;">
      <span>Don't have an account?</span>
      <a routerLink="/signup">Create User Account</a>
      <a routerLink="/admin-signup">Create Admin Account</a>
    </p>

  </div>

</div>
