<div class="auth-container">
  <div class="hero-section">
    <img
      src="images/flight.avif"
      alt="Flight Booking"
      class="hero-image"
    />
    <div class="hero-overlay">
      <div class="hero-content">
        <h1>
          Admin Portal
          <br>
          Registration
        </h1>
        <p>
          Create an administrator account to manage flights, monitor reservations, and oversee the travel system.
        </p>
      </div>
    </div>
  </div>

  <div class="auth-card">
    <h1>Create Admin Account</h1>
    <p class="subtitle">
      Join the Flight Booking System as an Administrator
    </p>

    <form (ngSubmit)="onRegister()">
      <div class="input-group">
        <label>First Name</label>
        <input type="text" name="firstName" [(ngModel)]="firstName" placeholder="Enter your first name" required />
      </div>

      <div class="input-group">
        <label>Last Name</label>
        <input type="text" name="lastName" [(ngModel)]="lastName" placeholder="Enter your last name" required />
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required />
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="password" placeholder="Create a password" required />
      </div>

      <button type="submit" class="btn-login" style="background-color: #333;">
        Register as Admin
      </button>
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <p class="bottom-text">
      Already have an account?
      <a routerLink="/login" [queryParams]="{role: 'ADMIN'}">
        Login as Admin
      </a>
    </p>
  </div>
</div>
