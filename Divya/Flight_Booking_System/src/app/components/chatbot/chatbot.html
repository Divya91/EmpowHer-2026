<div class="chatbot-container">
  <!-- Chat Window -->
  <div class="chat-window" *ngIf="isOpen" [class.open]="isOpen">
    <div class="chat-header">
      <div class="header-info">
        <div class="avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        </div>
        <span>AI Assistant</span>
      </div>
      <button class="close-btn" (click)="toggleChat()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    
    <div class="chat-body" #scrollMe>
      <div class="message-wrapper" *ngFor="let msg of messages" [ngClass]="msg.sender">
        <div class="message">{{ msg.text }}</div>
      </div>
      <div class="message-wrapper bot" *ngIf="isLoading">
        <div class="message typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    
    <div class="chat-footer">
      <input 
        type="text" 
        [(ngModel)]="currentMessage" 
        (keyup.enter)="sendMessage()" 
        placeholder="Type your message..." 
        [disabled]="isLoading"
      />
      <button class="send-btn" (click)="sendMessage()" [disabled]="!currentMessage.trim() || isLoading">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </div>
  </div>

  <!-- Floating Button -->
  <button class="floating-btn" (click)="toggleChat()" [class.hidden]="isOpen">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
  </button>
</div>
