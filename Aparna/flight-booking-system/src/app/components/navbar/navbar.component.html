<header class="navbar">
  <div class="navbar-inner">

    <!-- Brand Logo with Entrance Animation + Wordmark -->
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <div class="logo-wrapper">
        <img
          src="images/logo.png"
          class="logo-img"
          appLogoAnimation
          alt="Meridian Logo"
          width="36"
          height="36"
        />
      </div>
      <span class="brand-name">MERIDIAN</span>
    </a>

    <!-- Center Nav Links: EXACTLY TWO OPTIONS (Search, My Bookings) -->
    <nav class="nav-links" [class.open]="isMenuOpen">
      <a
        routerLink="/flights"
        routerLinkActive="active"
        (click)="closeMenu()">
        Search
      </a>
      <a
        routerLink="/my-bookings"
        routerLinkActive="active"
        (click)="closeMenu()">
        My Bookings
      </a>
    </nav>

    <!-- Right-Side Actions -->
    <div class="navbar-actions">

      @if (authService.isLoggedIn()) {

        <div class="profile-menu">
          <button type="button" class="profile-trigger" (click)="toggleProfile()" aria-label="Profile and Settings Menu">
            <span class="avatar">{{ initials(authService.currentUser()?.name) }}</span>
            <span class="profile-label">
              <span class="profile-name">{{ authService.currentUser()?.name }}</span>
            </span>
            <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
          </button>

          @if (isProfileOpen) {
            <div class="profile-dropdown">
              <div class="profile-dropdown-header">
                <span class="profile-dropdown-name">{{ authService.currentUser()?.name }}</span>
                <span class="profile-dropdown-email">{{ authService.currentUser()?.email }}</span>
              </div>
              <a routerLink="/profile" class="profile-dropdown-item" (click)="isProfileOpen = false">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="item-icon"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 10-16 0"/></svg>
                Profile & Settings
              </a>
              <a routerLink="/my-bookings" class="profile-dropdown-item" (click)="isProfileOpen = false">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="item-icon"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                My Bookings
              </a>
              <div class="dropdown-divider"></div>
              <button type="button" class="profile-dropdown-item logout" (click)="logout()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="item-icon"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sign Out
              </button>
            </div>
          }
        </div>

      } @else {

        <a routerLink="/auth" class="btn-ghost">Login</a>
        <a routerLink="/auth" [queryParams]="{ mode: 'signup' }" class="btn-solid">Sign Up</a>

      }

      <button type="button" class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </div>
</header>
