<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Management System - Login</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <!-- Brand Header Section -->
        <div class="login-header">
            <div class="logo">
                <i class="fa-solid fa-plane-departure"></i>
            </div>
            <h1>SkyLink Systems</h1>
            <p>Flight Management Portal</p>
        </div>

        <!-- Main Login Form -->
        <form class="login-form">
            <!-- System Role Selection Toggle -->
            <div class="role-selector">
                <input type="radio" id="passenger" name="role" value="passenger" checked>
                <label for="passenger"><i class="fa-solid fa-user"></i> Passenger</label>

                <input type="radio" id="admin" name="role" value="admin">
                <label for="admin"><i class="fa-solid fa-user-gear"></i> Admin</label>
            </div>

            <!-- Email Input Field -->
            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="name@airline.com" required>
                </div>
            </div>

            <!-- Password Input Field -->
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <!-- Account Utilities -->
            <div class="form-utilities">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-pass">Forgot Password?</a>
            </div>

            <!-- Form Action Buttons -->
            <button type="submit" class="submit-btn">
                Secure Login <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>

            <!-- Registration Redirection Link -->
            <p class="signup-redirect">
                New to SkyLink? <a href="#">Create an account</a>
            </p>
        </form>
    </div>
</body>
</html>
