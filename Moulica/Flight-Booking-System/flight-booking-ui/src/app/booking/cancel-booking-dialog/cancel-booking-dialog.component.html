<h2 mat-dialog-title>Cancel Booking</h2>

<mat-dialog-content>
  <p>Are you sure you want to cancel this booking?</p>

  <hr />

  <p><strong>Booking ID:</strong> {{ booking.bookingId }}</p>

  <p><strong>Passenger:</strong> {{ booking.passenger }}</p>

  <p>
    <strong>Flight:</strong> {{ booking.airline }}
    {{ booking.flightNumber }}
  </p>

  <p><strong>Route:</strong> {{ booking.from }} → {{ booking.to }}</p>

  <p><strong>Refund Amount:</strong> ₹{{ booking.price }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="keepBooking()">Keep Booking</button>

  <button mat-raised-button color="warn" (click)="cancelFlight()">
    Cancel Flight
  </button>
</mat-dialog-actions>
