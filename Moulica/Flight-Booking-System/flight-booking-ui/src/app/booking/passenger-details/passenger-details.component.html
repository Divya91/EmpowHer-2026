<form [formGroup]="passengerForm" class="passenger-form">
  <h2>Passenger Details</h2>
  <p class="subtitle">Please enter the passenger details.</p>

  <div class="row">
    <div class="field">
      <label>Title</label>

      <select formControlName="title">
        <option value="">Select</option>
        <option>Mr</option>
        <option>Mrs</option>
        <option>Miss</option>
      </select>
    </div>

    <div class="field">
      <label>Gender</label>

      <select formControlName="gender">
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>First Name</label>
      <input
        type="text"
        placeholder="Enter First Name"
        formControlName="firstName"
      />
    </div>

    <div class="field">
      <label>Last Name</label>
      <input
        type="text"
        placeholder="Enter Last Name"
        formControlName="lastName"
      />
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Date of Birth</label>

      <input type="date" formControlName="dob" />
    </div>

    <div class="field">
      <label>Age</label>

      <input type="number" formControlName="age" readonly />
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Nationality</label>

      <select formControlName="nationality">
        <option value="">Select Nationality</option>

        <option>Indian</option>
        <option>American</option>
        <option>Australian</option>
        <option>British</option>
        <option>Canadian</option>
      </select>
    </div>

    <div class="field">
      <label>Passport Number</label>

      <input
        type="text"
        placeholder="P1234567"
        formControlName="passportNumber"
      />
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Phone Number</label>

      <div class="phone-input">
        <span>+91</span>

        <input
          maxlength="10"
          type="tel"
          placeholder="9876543210"
          formControlName="phone"
        />
      </div>
    </div>

    <div class="field">
      <label>Email</label>

      <input
        type="email"
        placeholder="example@gmail.com"
        formControlName="email"
      />
    </div>
  </div>

  <div class="button-row">
    <button type="button" class="continue-btn" (click)="continue()">
      Continue →
    </button>
  </div>
</form>
