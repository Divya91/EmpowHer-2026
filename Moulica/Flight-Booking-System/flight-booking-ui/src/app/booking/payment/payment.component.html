<form [formGroup]="paymentForm" class="payment-form">
  <div class="fare-summary">
    <h3>Fare Summary</h3>

    <div class="fare-row">
      <span>Base Fare</span>
      <span>₹599.99</span>
    </div>

    <div class="fare-row">
      <span>Taxes</span>
      <span>₹120.00</span>
    </div>

    <div class="fare-row">
      <span>Convenience Fee</span>
      <span>₹40.00</span>
    </div>

    <hr />

    <div class="fare-row total">
      <span>Total</span>
      <span>₹759.99</span>
    </div>
  </div>

  <div class="field">
    <label>Payment Method</label>

    <select formControlName="paymentMethod">
      <option value="credit_card">Credit Card</option>

      <option value="debit_card">Debit Card</option>

      <option value="upi">UPI</option>

      <option value="net_banking">Net Banking</option>
    </select>
  </div>

  <h2>Payment Details</h2>

  <p class="subtitle">Enter your card information to complete the booking.</p>

  <div class="field">
    <label>Card Number</label>

    <input
      type="text"
      maxlength="16"
      placeholder="1234123412341234"
      formControlName="cardNumber"
    />
  </div>

  <div class="field">
    <label>Card Holder Name</label>

    <input type="text" placeholder="Name on Card" formControlName="cardName" />
  </div>

  <div class="row">
    <div class="field">
      <label>Expiry Date</label>

      <input type="month" formControlName="expiry" />
    </div>

    <div class="field">
      <label>CVV</label>

      <input
        type="password"
        maxlength="3"
        placeholder="123"
        formControlName="cvv"
      />
    </div>
  </div>

  <div class="button-row">
    <button type="button" class="back-btn" (click)="goBack()">← Back</button>

    <button type="button" class="pay-btn" (click)="confirmPayment()">
      Confirm & Pay
    </button>
  </div>
</form>
