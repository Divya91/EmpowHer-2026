spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skyroute}
    username: ${DATABASE_USERNAME:skyroute_user}
    password: ${DATABASE_PASSWORD:skyroute_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.skyroute: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
